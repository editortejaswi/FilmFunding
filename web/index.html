<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2a">
<link rel="manifest" href="manifest.webmanifest">
<title>FilmFund Radar</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--bd:#242833;--fg:#f2f4f8;--mut:#9aa3b2;--red:#e11d2a;--grn:#3ecf8e;--amb:#f2c94c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
  header .logo{font-weight:800}.header .logo b{color:var(--red)}
  header .who{margin-left:auto;color:var(--mut);font-size:12px;text-align:right}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px}
  .btn{background:var(--red);color:#fff;padding:11px 16px;font-weight:700;width:100%}
  .btn.sec{background:transparent;color:var(--mut);font-weight:500;width:auto;padding:6px 8px}
  input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--bd);background:#0b0d11;color:var(--fg);font:inherit;margin-top:8px}
  /* auth */
  #auth{max-width:380px;margin:8vh auto;padding:24px}
  #auth h1{font-size:24px;margin-bottom:4px}#auth h1 b{color:var(--red)}
  #auth .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  #auth .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  #auth .msg{margin-top:14px;font-size:13px;min-height:18px}
  #auth .msg.err{color:var(--red)}#auth .msg.ok{color:var(--grn)}
  .link{color:var(--red);background:none;font-size:13px;padding:0}
  /* feed */
  .tabs,.regions{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--mut);border-radius:999px;padding:7px 13px;font-size:13px}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  .chip .n{opacity:.7;margin-left:4px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 16px}
  .card h3{font-size:16px;line-height:1.3;margin-bottom:8px}
  .dl{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:8px}
  .dl.ok{background:rgba(62,207,142,.15);color:var(--grn)}.dl.soon{background:rgba(242,201,76,.15);color:var(--amb)}.dl.closed{background:rgba(225,29,42,.15);color:var(--red)}.dl.none{background:#242833;color:var(--mut)}
  .meta{color:var(--mut);font-size:13px;margin-bottom:12px}
  .apply{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px}
  .empty{color:var(--mut);text-align:center;padding:40px 16px}
  .foot{color:var(--mut);font-size:11px;text-align:center;padding:20px}
  .hidden{display:none!important}
</style>
</head>
<body>
<!-- AUTH -->
<div id="auth" class="hidden">
  <h1>🎬 FilmFund <b>Radar</b></h1>
  <div class="sub">Funding for your next film — worldwide, on time.</div>
  <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <div style="margin-top:16px"><button class="btn" id="primaryBtn">Sign in</button></div>
  <div class="row">
    <button class="link" id="toggleMode">New here? Create account</button>
    <button class="link" id="forgot">Forgot password?</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="logo">🎬 FilmFund <b style="color:var(--red)">Radar</b></div>
    <div class="who"><span id="whoEmail"></span><br><button class="btn sec" id="signout">Sign out</button></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="regions" id="regions"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ffweqsdxdylmjdgzcifk.supabase.co";
const SUPABASE_KEY = "sb_publishable_Sc41MabqKhz-wliJv0zOrA_tHlkF-Ei";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let mode = "signin"; // signin | signup

// ---------- AUTH ----------
function setMsg(t, cls=""){ const m=$("msg"); m.textContent=t; m.className="msg "+cls; }
function renderMode(){
  $("primaryBtn").textContent = mode==="signin" ? "Sign in" : "Create account";
  $("toggleMode").textContent = mode==="signin" ? "New here? Create account" : "Have an account? Sign in";
  $("pw").autocomplete = mode==="signin" ? "current-password" : "new-password";
  setMsg("");
}
$("toggleMode").onclick = ()=>{ mode = mode==="signin"?"signup":"signin"; renderMode(); };
$("primaryBtn").onclick = async ()=>{
  const email=$("email").value.trim(), pw=$("pw").value;
  if(!email || !pw){ setMsg("Enter email and password.","err"); return; }
  setMsg("…");
  try{
    if(mode==="signin"){
      const {error} = await sb.auth.signInWithPassword({email,password:pw});
      if(error) throw error;
    }else{
      const {error} = await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error) throw error;
      setMsg("Account created. Check your email to confirm, then sign in.","ok");
      mode="signin"; renderMode();
    }
  }catch(e){ setMsg(e.message||"Something went wrong.","err"); }
};
$("forgot").onclick = async ()=>{
  const email=$("email").value.trim();
  if(!email){ setMsg("Enter your email first, then tap Forgot password.","err"); return; }
  const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  setMsg(error ? error.message : "Reset link sent — check your email.", error?"err":"ok");
};
$("signout").onclick = async ()=>{ await sb.auth.signOut(); route(null); };

// ---------- FEED ----------
let OPPS=[], activeTab="", activeRegion="";
const TABS=[["","Live"],["open","Open"],["d7","≤7 days"],["d30","≤30 days"],["undated","No date"],["closed","Closed"],["all","All"]];
const today = new Date().toISOString().slice(0,10);
function daysLeft(dl){ if(!dl) return null; return Math.round((new Date(dl+"T00:00:00Z")-new Date(today+"T00:00:00Z"))/864e5); }
function inBucket(o,b){
  const dl=o.deadline, dated=!!dl, dleft=daysLeft(dl);
  switch(b){
    case "": return !(dated && dleft<0);          // live: hide closed
    case "open": return dated && dleft>=0;
    case "d7": return dated && dleft>=0 && dleft<=7;
    case "d30": return dated && dleft>=0 && dleft<=30;
    case "undated": return !dated;
    case "closed": return dated && dleft<0;
    case "all": return true;
  }
}
function fmtVal(v){ if(!v) return ""; if(v>=1e7) return "₹"+(v/1e7).toFixed(1)+" Cr"; if(v>=1e5) return "₹"+(v/1e5).toFixed(1)+" L"; return "₹"+v; }
function regionLabel(k){ return ({india:"India",usa:"United States",uk:"UK & Ireland",canada:"Canada",australia:"Australia",europe:"Europe",gulf:"Gulf",global:"Global"})[k] || (k? k[0].toUpperCase()+k.slice(1) : "Other"); }

function renderTabs(){
  $("tabs").innerHTML = TABS.map(([k,label])=>{
    const n = OPPS.filter(o=>inBucket(o,k)).length;
    return `<button class="chip ${k===activeTab?'on':''}" data-tab="${k}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  $("tabs").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeTab=c.dataset.tab;renderTabs();renderRegions();renderList();});
}
function renderRegions(){
  const regions=[...new Set(OPPS.filter(o=>inBucket(o,activeTab)).map(o=>o.region).filter(Boolean))].sort();
  $("regions").innerHTML = [["","🌍 All"],...regions.map(r=>[r,regionLabel(r)])].map(([k,label])=>
    `<button class="chip ${k===activeRegion?'on':''}" data-r="${k}">${label}</button>`).join("");
  $("regions").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeRegion=c.dataset.r;renderRegions();renderList();});
}
function dlBadge(o){
  const d=daysLeft(o.deadline);
  if(o.deadline===""||o.deadline==null) return `<span class="dl none">deadline: see call</span>`;
  if(d<0) return `<span class="dl closed">closed</span>`;
  if(d<=7) return `<span class="dl soon">${d} days left</span>`;
  return `<span class="dl ok">${d} days left</span>`;
}
function renderList(){
  let items=OPPS.filter(o=>inBucket(o,activeTab));
  if(activeRegion) items=items.filter(o=>o.region===activeRegion);
  $("list").innerHTML = items.length ? items.map(o=>`
    <div class="card">
      <h3>${escapeHtml(o.title)}</h3>
      ${dlBadge(o)}
      <div class="meta">${[regionLabel(o.region), fmtVal(o.value_inr), o.kind, o.org||o.source].filter(Boolean).map(escapeHtml).join(" · ")}</div>
      <a class="apply" href="${encodeURI(o.url)}" target="_blank" rel="noopener">View &amp; apply →</a>
    </div>`).join("") : `<div class="empty">Nothing here right now.</div>`;
  $("foot").textContent = `${OPPS.length} opportunities · updates daily`;
}
function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function loadFeed(){
  try{
    const r = await fetch("opportunities.json",{cache:"no-store"});
    const data = await r.json();
    OPPS = data.opportunities||[];
  }catch(e){ OPPS=[]; }
  renderTabs(); renderRegions(); renderList();
}

// ---------- ROUTING ----------
function route(session){
  if(session){
    $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
    $("whoEmail").textContent = session.user.email;
    loadFeed();
  }else{
    $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); renderMode();
  }
}
sb.auth.onAuthStateChange((_e,session)=>route(session));
(async ()=>{ const {data}=await sb.auth.getSession(); route(data.session); })();
</script>
</body>
</html>
